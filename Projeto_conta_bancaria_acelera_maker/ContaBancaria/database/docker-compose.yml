services:
  postgres:
    image: postgres:16
    container_name: banco_essencial_postgres
    restart: always
    environment:
      POSTGRES_DB: bancodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  postgres_data:
